name: Ember desktop CI
# Every push and pull request runs the client battery and a full 3-OS native
# build, independently of release publication (release.yml handles tags).
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          cache-on-failure: true
      - run: python -m pip install -r desktop/requirements-worker.txt
      - name: Client test battery
        run: python -c "import sys, unittest; unittest.main(module=None, argv=['unittest', 'test_ember_client', 'test_ember_history', 'test_ember_opportunity', 'test_ember_device_test', 'test_ember_stream', 'test_ember_browser_preparation', 'test_ember_market_readiness.ReadinessBudgetTests', 'test_ember_browser_lifecycle.ClientRecoveryTests', 'test_tt_market_semantics', 'test_tt_market_exec', 'test_execution_policy', 'test_draftkings_login', 'test_draftkings_live'])"
      - run: python -m unittest test_ember_board -v
      - run: python -m unittest desktop.test_native_smoke.NativeCapabilityTests -v
      - name: Overlapping H2H actual-client scheduler and multi-leg browser fixtures
        if: runner.os == 'Windows'
        run: python -m unittest test_ember_slip test_ember_staging test_ember_scheduling desktop.test_dashboard -v
      - name: Real-browser submission and recovery tiers
        if: runner.os == 'Windows'
        run: python -c "import sys, unittest; unittest.main(module=None, argv=['unittest', 'test_ember_provider_login', 'test_ember_browser_lifecycle.BrowserLifecycleTests', 'test_ember_browser_lifecycle.ClientRecoveryTests', 'test_ember_browser_lifecycle.OwnedBrowserFaultTests', 'test_ember_browser_lifecycle.NativeBrowserStartupTests', 'test_ember_market_readiness.MarketReadinessBrowserTests', 'test_tt_bet_slip.PlanExecutionBrowserTests', 'desktop.test_dashboard'])"
      - run: python desktop/build_worker.py
      - run: python desktop/verify_bundle.py
      - name: Packaged worker startup smoke (startup gate for every native host)
        run: python -m unittest desktop.test_startup_check desktop.test_startup_smoke -v
        timeout-minutes: 30
      - run: npm ci
        working-directory: desktop
      - run: npx tauri icon icon.svg
        working-directory: desktop
      - name: Build signature-verified update bundle
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.EMBER_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.EMBER_UPDATER_KEY_PASSWORD }}
        run: python build_native.py --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Native WebView receives packaged worker events (no sign-in or wagers)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = $roots | Where-Object { Test-Path -LiteralPath $_ } | ForEach-Object { Get-ChildItem -LiteralPath $_ -Filter msedgewebview2.exe -Recurse } | Sort-Object { [version]$_.VersionInfo.FileVersion } -Descending | Select-Object -First 1
          if (!$runtime) { throw 'A native WebView2 runtime is required for the event integration gate' }
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $runtime.DirectoryName
          python -m unittest desktop.test_native_smoke -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
